---
layout: default
---

<main id="main" class="post-page">
    <article>
        <header class="post-header">
            <div class="wrap">
                <nav class="post-breadcrumbs" aria-label="Breadcrumb">
                    <a href="{{ '/' | relative_url }}">HOME</a>
                    <span aria-hidden="true">/</span>
                    <a href="{{ '/blog/' | relative_url }}">NEWS</a>
                </nav>

                <div class="post-meta">
                    <time datetime="{{ page.date | date_to_xmlschema }}">
                        {{ page.date | date: "%B %-d, %Y" }}
                    </time>

                    {% for category in page.categories %}
                    <span class="blog-category">
              {{ category | replace: "-", " " }}
            </span>
                    {% endfor %}
                </div>

                <h1>{{ page.title | escape }}</h1>

                {% if page.description %}
                <p class="post-description">{{ page.description | escape }}</p>
                {% endif %}
            </div>
        </header>

        <div class="wrap post-content-wrap">
            <div class="post-content">
                {{ content }}
            </div>

            <footer class="post-footer">
                <a class="text-link" href="{{ '/blog/' | relative_url }}">
                    ← BACK TO ALL NEWS
                </a>
            </footer>
        </div>
    </article>
</main>
